[main]
font=Inter:pixelsize=16
# Swapped to a light-friendly icon theme
icon-theme=Papirus-Light
fields=name,generic,comment,categories,filename
terminal=kitty -e   
# Matches the single bracket prompt in the reference
prompt="> "
layer=overlay
horizontal-pad=20
vertical-pad=15
inner-pad=8

[colors]
# Solid warm cream background (no transparency)
background=f6f4e8ff
# Deep charcoal text for high readability
text=333333ff
# Clean blue highlight for matched query characters
match=2563ebff
# Warm tan accent for the hovered item highlight
selection=ebdcb9ff
# Sharp black text inside the active hover bar
selection-text=000000ff
# Subtle, soft border frame
border=b5b3a6ff

[border]
# Thin border to match the clean minimalist aesthetic
width=1
# Increased radius for smoother, softer rounded corners
radius=12

